name: Render LiFR v2 teaser

on:
  push:
    paths:
      - ".github/workflows/render-lifr-teaser.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homepage
        uses: actions/checkout@v4

      - name: Install PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download original LiFR v2 teaser PDF
        run: |
          curl -L --fail             "https://raw.githubusercontent.com/TaoWan0610/LiFR-v2/main/assets/teaser.pdf"             -o /tmp/lifr-v2-teaser.pdf

      - name: Render high-resolution PNG
        run: |
          mkdir -p assets/img
          pdftoppm -png -singlefile -r 300             /tmp/lifr-v2-teaser.pdf             assets/img/lifr-v2

      - name: Commit teaser image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/lifr-v2.png
          if ! git diff --cached --quiet; then
            git commit -m "Render original LiFR v2 teaser image"
            git push
          fi
